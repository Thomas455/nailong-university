<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶龙展览馆 · 宇宙奶龙大学</title>
<meta name="description" content="宇宙奶龙大学 25 个学院的展位与艺术作品。">
<meta name="theme-color" content="#080b1a">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* ============================================================
     展览馆网格
     ============================================================ */
  .booths { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }

  .booth {
    position: relative;
    display: flex; flex-direction: column;
    aspect-ratio: 3 / 4;                  /* 竖版：宽 3 高 4 */
    border-radius: 18px; overflow: hidden;
    background: var(--card); border: 1px solid rgba(254, 206, 14, .16);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
    cursor: pointer;
    transition: transform .22s, border-color .22s, box-shadow .22s;
  }
  .booth:hover, .booth:focus-visible {
    transform: translateY(-4px); border-color: rgba(254, 206, 14, .55);
    box-shadow: 0 14px 36px rgba(0, 0, 0, .5); outline: none;
  }

  /* 图片区：吃掉卡片剩余的全部高度（flex:1），所以卡片是竖的、图也是竖的 */
  .booth .ph {
    position: relative; flex: 1; min-height: 0; width: 100%;
    background:
      linear-gradient(135deg, rgba(122,152,255,.16), rgba(176,132,255,.12)),
      #0d1224;
    display: grid; place-items: center; overflow: hidden;
  }
  .booth .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 占位内容：图片没找到时显示学院首字，比空白好看 */
  .booth .ph .fallback {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--muted); font-size: 12px; text-align: center; padding: 8px;
  }
  .booth .ph .fallback b {
    font-size: 40px; font-weight: 800; color: rgba(254, 206, 14, .5); line-height: 1;
  }
  /* 图片加载失败 → 给 .ph 加 .miss，把裂图整个 display:none 掉。
     不能只给 img 加 hidden —— 浏览器在脚本跑之前就已经把裂图画出来了。 */
  .booth .ph.miss img { display: none; }
  .booth .ph:not(.miss) .fallback { display: none; }

  /* 院名：固定在底部，最多撑三行（有个学院名很长，两行都放不下） */
  .booth .name {
    flex: 0 0 auto;
    padding: 12px 12px 14px;
    font-size: 13.5px; font-weight: 700; line-height: 1.45;
    text-align: center; letter-spacing: .01em;
    border-top: 1px solid rgba(254, 206, 14, .12);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* 悬停时露一句提示，让人知道卡片能点 */
  .booth .peek {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 7px 10px; font-size: 12px; font-weight: 700;
    text-align: center; color: #2a2000; background: var(--ink);
    opacity: 0; transform: translateY(-100%);
    transition: opacity .2s, transform .2s;
  }
  .booth:hover .peek, .booth:focus-visible .peek { opacity: 1; transform: none; }

  /* ============================================================
     翻转舞台

     网格和翻转卡是两套独立的 DOM：
       · .booths 是网格（原样不动）
       · .stage 里那张卡固定定位在屏幕中央，翻转后放大铺开
     点卡片时给 .stage 加 .open —— 它从「和原卡片重合的小尺寸」动画到全屏。
     之所以不做真正的「从原位置飞出」：那需要 FLIP 技巧测量坐标，
     在这个体量下收益不大，而且窗口一滚就错位。
     ============================================================ */
  .stage {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    pointer-events: none; opacity: 0;
    transition: opacity .28s;
  }
  .stage.open { opacity: 1; pointer-events: auto; }
  /* 背景压暗，点它也能关闭 */
  .stage::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(4, 6, 16, .78);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }

  .flipcard {
    position: relative;
    width: min(94vw, 1080px); height: min(88vh, 900px);
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4, .05, .2, 1);
  }
  /* 合上时缩小一点，翻开时回到原尺寸 —— 配合 .stage 的淡入做「变大」的观感 */
  .stage:not(.open) .flipcard { transform: scale(.86) rotateY(0deg); }
  .flipcard.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    border-radius: 20px; overflow: hidden;
    background: var(--card); border: 1px solid rgba(254, 206, 14, .22);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6);
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    display: flex; flex-direction: column;
  }
  /* 背面转 180° 预先翻好，父级一转就正对观众 */
  .face.back { transform: rotateY(180deg); }

  /* 正面：展厅标题（合上状态其实看不到，留着是为了翻转过程有东西可看） */
  .face.front { align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
  .face.front h2 { font-size: clamp(20px, 4vw, 28px); font-weight: 800; }
  .face.front p { color: var(--muted); font-size: 14px; }

  /* ---------- 背面：作品列表 ---------- */
  .works-head {
    flex: 0 0 auto;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 22px 14px;
    border-bottom: 1px solid rgba(254, 206, 14, .16);
    background: linear-gradient(180deg, rgba(30, 37, 64, .9), rgba(20, 26, 46, .6));
  }
  .works-head h2 { font-size: clamp(16px, 3.6vw, 21px); font-weight: 800; letter-spacing: .02em; }
  .works-head .cnt { font-size: 13px; color: var(--muted); }

  /* 作品网格：可上下滚动。滚动条也做了深色适配 */
  .works {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: grid; gap: 14px; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    padding: 18px 22px 26px;
    scrollbar-width: thin; scrollbar-color: rgba(254, 206, 14, .35) transparent;
  }
  .works::-webkit-scrollbar { width: 10px; }
  .works::-webkit-scrollbar-track { background: transparent; }
  .works::-webkit-scrollbar-thumb {
    background: rgba(254, 206, 14, .3); border-radius: 99px;
    border: 3px solid transparent; background-clip: content-box;
  }
  .works::-webkit-scrollbar-thumb:hover { background: rgba(254, 206, 14, .55); background-clip: content-box; }

  .work {
    position: relative; margin: 0; border-radius: 12px; overflow: hidden;
    aspect-ratio: 3 / 4; cursor: zoom-in;
    background: #0d1224; border: 1px solid rgba(254, 206, 14, .14);
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .work:hover, .work:focus-visible {
    transform: translateY(-3px) scale(1.02);
    border-color: rgba(254, 206, 14, .6);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .5); outline: none;
  }
  .work img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 悬停显示文件名：从底部滑上来 */
  .work figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 22px 10px 9px;
    font-size: 12px; line-height: 1.4; font-weight: 600; color: #fff;
    background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .82));
    opacity: 0; transform: translateY(100%);
    transition: opacity .2s, transform .2s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .work:hover figcaption, .work:focus-visible figcaption { opacity: 1; transform: none; }

  .works-empty {
    grid-column: 1 / -1;
    padding: 46px 24px; border-radius: 14px; text-align: center;
    border: 1px dashed rgba(254, 206, 14, .3);
    color: var(--muted); font-size: 14px; line-height: 1.9;
  }
  .works-empty code {
    padding: 1px 6px; border-radius: 6px;
    background: var(--track); color: var(--ink); font-weight: 700;
  }

  /* 右下角「关闭」—— 翻回去，回到最初的展览馆网格 */
  .works-foot {
    flex: 0 0 auto;
    display: flex; justify-content: flex-end;
    padding: 12px 22px 16px;
    border-top: 1px solid rgba(254, 206, 14, .16);
    background: rgba(13, 18, 36, .6);
  }
  .close-works {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 20px; border-radius: 999px; border: 1px solid rgba(254, 206, 14, .4);
    background: var(--track); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: background-color .2s, border-color .2s, color .2s, transform .2s;
  }
  .close-works:hover, .close-works:focus-visible {
    background: var(--ink); color: #2a2000; border-color: var(--ink); transform: translateY(-1px);
  }
  .close-works svg { width: 15px; height: 15px; }

  /* 翻开时锁住页面滚动 */
  html.flipping, html.flipping body { overflow: hidden; }

  /* ============================================================
     灯箱：单击作品放大
     ============================================================ */
  .viewer {
    width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh;
    margin: 0; padding: 0; border: 0; background: transparent;
    display: none; place-items: center;
  }
  .viewer[open] { display: grid; }
  /* 背景纯黑压住一切，让作品成为唯一焦点 */
  .viewer::backdrop { background: rgba(2, 3, 10, .94); }

  .viewer img {
    max-width: 92vw; max-height: 84vh;
    object-fit: contain; display: block;
    border-radius: 8px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, .8);
  }
  /* 右上角 × */
  .viewer-close {
    position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    display: grid; place-items: center; cursor: pointer;
    background: rgba(255, 255, 255, .12); color: #fff;
    transition: background-color .2s, transform .2s;
  }
  .viewer-close:hover, .viewer-close:focus-visible {
    background: rgba(255, 255, 255, .26); transform: rotate(90deg);
  }
  .viewer-close svg { width: 20px; height: 20px; }
  /* 底部文件名 */
  .viewer-name {
    position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom));
    text-align: center; color: #dfe4f5; font-size: 14px; letter-spacing: .02em;
    padding: 0 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    pointer-events: none;
  }

  /* 窄屏：翻转卡铺得更满一些，作品格子收小 */
  @media (max-width: 620px) {
    .flipcard { width: 96vw; height: 90vh; }
    .works { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); padding: 14px; gap: 10px; }
    .works-head { padding: 14px 16px 12px; }
    .works-foot { padding: 10px 16px 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flipcard, .stage, .booth, .work, .work figcaption, .peek { transition: none; }
  }
</style>
</head>
<body data-back="home.html" data-back-label="返回">

<div class="wrap-page">
  <header class="page-head">
    <h1>奶龙展览馆</h1>
    <p>全校 25 个学院的展位 · 点开卡片看作品</p>
  </header>
  <main class="booths" id="booths"></main>
</div>

<!-- 翻转舞台：点卡片后从中央放大展开，露出该学院的作品 -->
<div class="stage" id="stage" aria-hidden="true">
  <div class="flipcard" id="flipcard" aria-hidden="true">
    <div class="face front">
      <h2 id="frontTitle">奶龙展览馆</h2>
      <p>正在翻开……</p>
    </div>
    <div class="face back">
      <div class="works-head">
        <h2 id="worksTitle"></h2>
        <span class="cnt" id="worksCount"></span>
      </div>
      <div class="works" id="works"></div>
      <div class="works-foot">
        <button class="close-works" id="closeWorks" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          关闭
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 灯箱：点作品放大。用 dialog 是为了白拿 Esc 关闭 + 焦点陷阱 -->
<dialog class="viewer" id="viewer" aria-label="作品预览">
  <button class="viewer-close" id="viewerClose" type="button" aria-label="关闭预览">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <img id="viewerImg" src="" alt="">
  <div class="viewer-name" id="viewerName"></div>
</dialog>

<script src="assets/site.js"></script>
<script src="assets/works.js"></script>
<script>
// 学院名录。顺序就是页面上从左到右、从上到下的顺序。
// name = 卡片上显示的院名；file = src/ 和 works/ 下的目录名 / 文件名。
// 两者分开是因为「管理学院（旅游学院/中法旅游学院）」里有个斜杠 ——
// 斜杠在 Windows / macOS / Linux 上都不能做文件名，所以文件那边用「·」代替。
var COLLEGES = [
  { name: '经济与统计学院' },
  { name: '法学院（律师学院）' },
  { name: '马克思主义学院' },
  { name: '教育学院（师范学院）' },
  { name: '体育学院' },
  { name: '人文学院' },
  { name: '外国语学院' },
  { name: '新闻与传播学院' },
  { name: '管理学院（旅游学院/中法旅游学院）', file: '管理学院（旅游学院·中法旅游学院）' },
  { name: '公共管理学院' },
  { name: '音乐舞蹈学院' },
  { name: '美术与设计学院' },
  { name: '数学与信息科学学院' },
  { name: '物理与材料科学学院' },
  { name: '化学化工学院' },
  { name: '地理科学与遥感学院' },
  { name: '生命科学学院' },
  { name: '机械与电气工程学院' },
  { name: '电子与通信工程学院' },
  { name: '计算机科学与网络工程学院' },
  { name: '建筑与城市规划学院' },
  { name: '土木与交通工程学院' },
  { name: '环境科学与工程学院' },
  { name: '网络空间安全学院' },
  { name: '人工智能学院' }
].map(function (c) { return { name: c.name, file: c.file || c.name }; });

(function () {
  var box = document.getElementById('booths');
  var frag = document.createDocumentFragment();

  COLLEGES.forEach(function (item) {
    var name = item.name;

    // 用 button 而不是 div：键盘能 Tab 到、回车能触发，无障碍上更正确
    var el = document.createElement('button');
    el.className = 'booth';
    el.type = 'button';
    el.setAttribute('aria-label', name + ' · 点开看作品');

    var peek = document.createElement('span');
    peek.className = 'peek';
    peek.textContent = '点开看作品';

    var ph = document.createElement('div');
    ph.className = 'ph';

    var img = document.createElement('img');
    // 用 webp：同一张图 PNG 要 1~4MB，webp q88 只要 60~340KB（省 90% 以上）。
    img.src = 'src/' + encodeURIComponent(item.file) + '.webp';
    img.alt = '';                         // 学院名已经在下面单独显示了，别读两遍
    img.decoding = 'async';

    var fb = document.createElement('div');
    fb.className = 'fallback';
    fb.innerHTML = '<b></b><span>图片待补充</span>';
    fb.querySelector('b').textContent = name.charAt(0);

    // 加载失败就标记整个框，CSS 会把裂图藏掉、露出占位。
    // 用 .miss 而不是 img.hidden：有些浏览器在脚本执行前就把裂图渲染出来了。
    function markMiss() { ph.classList.add('miss'); }
    img.addEventListener('error', markMiss);
    if (img.complete && img.naturalWidth === 0) markMiss();

    ph.appendChild(img);
    ph.appendChild(fb);

    var label = document.createElement('div');
    label.className = 'name';
    label.textContent = name;

    el.appendChild(peek);
    el.appendChild(ph);
    el.appendChild(label);

    el.addEventListener('click', function () {
      document.getElementById('frontTitle').textContent = name;
      window.__boothOpen(item, el);
    });

    frag.appendChild(el);
  });

  box.appendChild(frag);
})();
</script>
<script src="assets/gallery.js"></script>
</body>
</html>
