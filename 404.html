<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>页面走丢了 · 宇宙奶龙大学</title>
<meta name="description" content="这个页面不存在。奶龙带你回到宇宙奶龙大学。">
<meta name="theme-color" content="#080b1a">
<meta name="robots" content="noindex">
<!-- ⚠️ 这个页面用【绝对路径】/assets/...，和别的页面不一样，是有原因的：
     Cloudflare 在任何路径深度都会返回 404.html，但地址栏还是原来那个坏路径
     （比如 /foo/bar）。这时相对路径 assets/site.css 会被解析成
     /foo/assets/site.css —— 那份也不存在，页面就变成没样式的白板了。
     站点挂在 apex 域名根目录（CNAME 是 xn--psszg58cydsdq780c.com），
     所以 /assets/... 一定指得到。
     代价：双击本地打开这个文件时样式会加载失败（这是唯一一个不能 file:// 预览的页面）。 -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/assets/site.css">
<style>
  body { display: grid; place-items: center; text-align: center; }

  .oops { width: 100%; max-width: 560px; }

  /* 大号 404：用渐变描边做点质感，不额外请求字体 */
  .code {
    font-size: clamp(72px, 22vw, 132px);
    font-weight: 800; line-height: .95; letter-spacing: .02em;
    background: linear-gradient(160deg, var(--ink), #ff9f43 55%, #ff6b60);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    /* 兜底：万一浏览器不支持 background-clip: text，别让字彻底看不见 */
    -webkit-text-fill-color: transparent;
  }
  @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
    .code { color: var(--ink); -webkit-text-fill-color: var(--ink); background: none; }
  }

  h1 { margin-top: 18px; font-size: clamp(20px, 5vw, 28px); font-weight: 800; letter-spacing: .06em; }
  .sub { margin-top: 12px; font-size: clamp(13px, 3.6vw, 15px); line-height: 1.8; color: var(--muted); }

  /* 把用户访问的那个坏地址显示出来，方便确认是不是打错了 */
  .tried {
    margin-top: 16px; padding: 9px 14px; border-radius: 10px;
    display: inline-block; max-width: 100%;
    background: var(--track); color: var(--ink);
    font-size: 13px; font-weight: 600;
    overflow-wrap: anywhere;              /* 超长路径也能断行，不撑破布局 */
  }
  .tried:empty { display: none; }

  .acts { margin-top: 30px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 700; text-decoration: none;
    border: 1px solid rgba(254, 206, 14, .4);
    background: var(--track); color: var(--ink);
    transition: background-color .2s, border-color .2s, color .2s, transform .2s;
  }
  .btn:hover, .btn:focus-visible {
    background: var(--ink); color: #2a2000; border-color: var(--ink); transform: translateY(-2px);
  }
  .btn.ghost { background: transparent; color: var(--fg); border-color: rgba(255, 255, 255, .22); }
  .btn.ghost:hover, .btn.ghost:focus-visible {
    background: rgba(255, 255, 255, .12); color: var(--fg); border-color: rgba(255, 255, 255, .4);
  }
  .btn svg { width: 16px; height: 16px; }

  /* 小彩蛋：奶龙跺脚 */
  .stomp { display: inline-block; animation: stomp 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes stomp {
    0%, 62%, 100% { transform: translateY(0) rotate(0); }
    68%           { transform: translateY(-3px) rotate(-6deg); }
    74%           { transform: translateY(0) rotate(4deg); }
    80%           { transform: translateY(-2px) rotate(-3deg); }
    86%           { transform: translateY(0) rotate(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stomp { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body data-no-back>

<div class="wrap-page oops">
  <div class="code" aria-hidden="true">404</div>

  <h1><span class="stomp" aria-hidden="true">🐉</span> 这个页面走丢了</h1>

  <p class="sub">
    奶龙在宇宙里翻了一圈，没找到你要的那一页。<br>
    可能是地址打错了，或者这个页面已经被搬走了。
  </p>

  <!-- JS 会把当前访问的路径填进来；禁用 JS 时这块是空的，CSS 会把它隐藏掉 -->
  <p class="tried" id="tried"></p>

  <div class="acts">
    <a class="btn" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5"/>
      </svg>
      回首页
    </a>
    <a class="btn ghost" href="/home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 21V9.5L12 4l8 5.5V21"/><path d="M9 21v-6h6v6"/>
      </svg>
      奶龙主页
    </a>
  </div>
</div>

<script src="/assets/site.js"></script>
<script>
// 把用户实际访问的地址显示出来 —— 多半能一眼看出是不是打错了
(function () {
  var el = document.getElementById('tried');
  if (!el) return;

  var p = location.pathname + location.search;
  // 浏览器给的 pathname 是百分号编码的（中文会变成 %E4%B8%8D…），
  // 直接显示没人看得懂。decodeURI 解回来，解不开就退回原样。
  try { p = decodeURI(p); } catch (e) { /* 编码不合法，保持原样 */ }

  // 太长就截断，免得撑破布局（CSS 也有 overflow-wrap 兜底）
  if (p.length > 120) p = p.slice(0, 117) + '…';
  el.textContent = p;
})();
</script>
</body>
</html>
