<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奶龙主页 · 宇宙奶龙大学</title>
<meta name="description" content="宇宙奶龙大学的导航主页：奶龙展览馆、网站公告，还有更多在建设中。">
<meta name="theme-color" content="#080b1a">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="favicon.png">
<!-- 和子页面共用同一套样式，风格才不会各写各的 -->
<link rel="stylesheet" href="assets/site.css">
</head>
<!-- data-back-force：不管从哪来，「返回首页」都去 index.html。
     不加这个的话，从 show.html / notice.html 点进来时，按钮会走 history.back()
     退回上一页，和「返回首页」这四个字对不上。 -->
<body data-back="index.html" data-back-label="返回首页" data-back-force>

<div class="wrap-page">
  <header class="page-head">
    <!-- 「欢迎来到」和域名之间用 &nbsp; 而不是普通空格：HTML 会把连续空格
         折叠成一个，两个 &nbsp; 才能稳定留出两格的间距 -->
    <h1>欢迎来到&nbsp;&nbsp;宇宙奶龙大学.com</h1>
    <p>奶龙的校园门户 · 想去哪儿点哪儿</p>
  </header>

  <main class="grid quad">
    <!-- 奶龙展览馆 -->
    <a class="card" href="show.html">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"/>
          <path d="M4 21V9.5L12 4l8 5.5V21"/>
          <path d="M9 21v-6h6v6"/>
          <path d="M12 4V2"/>
        </svg>
      </span>
      <h2>奶龙展览馆</h2>
      <p>全校 25 个学院的展位，点进去逛逛。</p>
      <span class="arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </span>
    </a>

    <!-- 网站公告 -->
    <a class="card" href="notice.html">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/>
          <path d="M8 9h8M8 13h8M8 17h5"/>
        </svg>
      </span>
      <h2>网站公告</h2>
      <p>站内的通知和更新记录，最新的排在最上面。</p>
      <span class="arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </span>
    </a>

    <!-- 图片投稿 → 投稿站（另一个子域名，所以用绝对地址） -->
    <a class="card" href="https://submit.xn--psszg58cydsdq780c.com/"
       target="_blank" rel="noopener">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z"/>
        </svg>
      </span>
      <h2>图片投稿</h2>
      <p>把你的奶龙作品投给展览馆，会出现在对应学院的展位里。</p>
      <span class="arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </span>
    </a>

    <!-- 一个占位：还没做，明确标出来，别让人点了没反应 -->
    <div class="card soon">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <path d="M8 9h8M8 13h5"/>
        </svg>
      </span>
      <h2>留言板</h2>
      <p>给奶龙留句话，说说你想去哪个学校。</p>
      <span class="badge-soon">敬请期待</span>
    </div>
  </main>
</div>

<script src="assets/site.js"></script>
</body>
</html>
