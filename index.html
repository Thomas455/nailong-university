<style>
  /* 只做深色一套。color-scheme 固定 dark，滚动条、表单控件也跟着走。 */
  :root {
    --bg: #080b1a;
    --fg: #eef1ff;
    --muted: #8b93b8;
    --ink: #fece0e;
    --warn: #ff6b60;
    --go: #3ddc84;
    --track: rgba(254, 206, 14, .18);
    --card: #141a2e;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { user-select: none; }

  /* 3D 画布铺满全屏。fixed 而不是 absolute：手机地址栏伸缩时不跟着抖。 */
  #scene {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: manipulation;
  }

  /* 最后冲进星球时的白场。盖在画布上、在所有 UI 之下。 */
  #veil {
    position: fixed; inset: 0; z-index: 5;
    background: radial-gradient(circle at 50% 45%, #fff8e0 0%, #ffd979 38%, #fece0e 100%);
    opacity: 0; pointer-events: none;
    transition: opacity .7s ease-in;
  }
  #veil.on { opacity: 1; }

  /* ---------- 覆盖层 ---------- */
  /* 整个 HUD 不吃点击，只有里面的按钮单独开启 ——
     否则透明区域会把 3D 拖拽/点击全挡住。 */
  .hud {
    position: fixed; inset: 0; z-index: 10;
    pointer-events: none;
    display: flex; flex-direction: column;
    /* 底部留出 64px：右下「关于」、正下「回主页」都固定在 bottom:10px，
       不留白的话校史卡下面的提示文字会压在按钮上 */
    padding: max(18px, env(safe-area-inset-top)) 18px max(64px, env(safe-area-inset-bottom));
    transition: opacity .5s;
  }
  .hud.gone { opacity: 0; }

  /* ---------- 顶部标题 + 语录 ---------- */
  .top { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: clamp(15px, 4vw, 19px); font-weight: 800; letter-spacing: .14em;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .85), 0 0 40px rgba(8, 11, 26, .9);
  }
  .brand .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 0 12px var(--ink);
    animation: pulseDot 1.6s ease-in-out infinite;
  }

  /* 语录：放在标题下面一行，小字，不抢 3D 的视线 */
  .quote {
    max-width: 26em; text-align: center;
    font-size: clamp(12px, 3.3vw, 13.5px); line-height: 1.7; font-weight: 600;
    color: rgba(238, 241, 255, .82);
    text-shadow: 0 1px 12px rgba(0, 0, 0, .95), 0 0 24px rgba(8, 11, 26, .9);
    min-height: 1.7em;
    transition: opacity .35s;
  }
  .quote:empty { opacity: 0; }
  .quote.on { animation: quoteIn .5s ease-out; }

  /* ---------- 倒计时 ---------- */
  /* 做成标题下方的小徽章，而不是铺满屏幕的大数字 ——
     巨大的数字会和火箭重叠，桌面和手机上都难看。 */
  #countdown {
    align-self: center;
    font: 800 clamp(12px, 3.4vw, 14px)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .18em;
    padding: 6px 14px 6px 16px;
    border-radius: 999px;
    color: #3a2c00;
    background: var(--ink);
    box-shadow: 0 0 22px rgba(254, 206, 14, .55);
    pointer-events: none;
  }
  #countdown.pulse { animation: cdPulse .55s cubic-bezier(.3, 1.6, .6, 1); }
  #countdown[hidden] { display: none; }

  /* ---------- 校史卡片 ---------- */
  /* .bottom 用 margin-top:auto 压到底部（HUD 是 flex column），
     .top 在上面，中间大片留给 3D 画面。 */
  .bottom {
    margin-top: auto;
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
  }


  /* ---------- 悬浮「出发」按钮 ---------- */
  .go-btn {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.85);
    z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 15px 30px;
    white-space: nowrap;
    border: 0; border-radius: 999px;
    font: inherit; font-size: clamp(14px, 3.9vw, 17px); font-weight: 800; letter-spacing: .06em;
    color: #3a2c00;
    background: linear-gradient(180deg, #ffe066 0%, #fece0e 55%, #e8b400 100%);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .35) inset,
                0 10px 40px rgba(254, 206, 14, .45),
                0 0 80px rgba(254, 206, 14, .28);
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity .6s, transform .6s cubic-bezier(.2, 1.3, .4, 1), box-shadow .3s;
  }
  .go-btn[hidden] { display: none; }
  .go-btn.show {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
    animation: goBreathe 2.4s ease-in-out infinite;
  }
  .go-btn:hover, .go-btn:focus-visible {
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .5) inset,
                0 14px 50px rgba(254, 206, 14, .65),
                0 0 110px rgba(254, 206, 14, .45);
  }
  .go-btn.gone { opacity: 0; transform: translate(-50%, -50%) scale(1.35); pointer-events: none; }
  .go-btn .arrow { font-size: 1.1em; line-height: 1; }

  /* 「还没到」的提示，按钮未出现时给个方向感 */
  .hint {
    margin: 0 auto 6px;
    font-size: clamp(12px, 3.4vw, 13px); color: rgba(238, 241, 255, .55);
    text-align: center; letter-spacing: .06em;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .9);
    transition: opacity .4s;
  }
  .hint.gone { opacity: 0; }

  /* 环视提示：太空段出现几秒后自动淡出，别一直占着屏幕 */
  .hint-orbit {
    font-size: clamp(11px, 3.1vw, 12.5px);
    color: rgba(238, 241, 255, .42);
    letter-spacing: .08em;
    transition: opacity 1.2s;
  }
  .hint-orbit[hidden] { display: none; }
  .hint-orbit.out { opacity: 0; }

  /* ---------- 三个原有按钮 ---------- */
  .gh-btn {
    position: fixed; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 30;
    display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    color: var(--muted); text-decoration: none; opacity: .75; overflow: hidden;
    transition: color .2s, opacity .2s, background-color .2s, transform .25s;
  }
  .gh-btn:hover, .gh-btn:focus-visible {
    color: var(--fg); opacity: 1; background: var(--track); transform: rotate(-10deg) scale(1.1);
  }
  .gh-btn svg { display: block; width: 23px; height: 23px; }

  .home-btn {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 30;
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
    color: var(--muted); text-decoration: none; opacity: .8; overflow: hidden;
    transition: color .2s, opacity .2s, background-color .2s, transform .25s;
  }
  .home-btn:hover, .home-btn:focus-visible {
    color: var(--ink); opacity: 1; background: var(--track);
    transform: translateX(-50%) translateY(-3px) scale(1.08);
  }
  .home-btn svg { display: block; width: 22px; height: 22px; }

  .about-btn {
    position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
    z-index: 30;
    padding: 8px 10px; border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 13px; cursor: pointer;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
    transition: color .2s, text-decoration-color .2s;
  }
  .about-btn:hover, .about-btn:focus-visible { color: var(--fg); text-decoration-color: currentColor; }

  /* 跳转/离场时三个按钮一起淡出 */
  .hud.gone ~ .gh-btn, .hud.gone ~ .home-btn, .hud.gone ~ .about-btn { opacity: 0; }
  .gh-btn, .home-btn, .about-btn { transition: opacity .5s, color .2s, background-color .2s, transform .25s; }

  /* ---------- 关于弹窗 ---------- */
  .about {
    width: min(380px, calc(100vw - 32px)); margin: auto; padding: 0; border: 0; border-radius: 16px;
    background: var(--card); color: var(--fg); box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    cursor: auto; user-select: text;
  }
  .about[open] { animation: rise .25s ease-out; }
  .about::backdrop { background: rgba(8, 9, 20, .62); backdrop-filter: blur(4px); }
  .about-body { padding: 24px 22px 18px; }
  .about h2 { font-size: 18px; margin-bottom: 12px; }
  .about p { font-size: 14px; line-height: 1.75; }
  .about p + p { margin-top: 8px; }
  .about code {
    padding: 1px 6px; border-radius: 6px; background: var(--track);
    font: inherit; font-weight: 700; white-space: nowrap;
  }
  .about form { margin-top: 18px; text-align: right; }
  .about form button {
    padding: 8px 18px; border-radius: 999px; background: var(--ink); color: #3a2c00;
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  /* 只给读屏器的文字 */
  .sr {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }

  /* ---------- 动画 ---------- */
  @keyframes pulseDot { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes cdPulse {
    from { transform: scale(1.35); opacity: .2; }
    to   { transform: scale(1); opacity: 1; }
  }
  @keyframes quoteIn { from { opacity: 0; transform: translateY(3px); } }
  @keyframes goBreathe {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset,
                           0 10px 40px rgba(254,206,14,.45),
                           0 0 80px rgba(254,206,14,.28); }
    50%      { box-shadow: 0 0 0 1px rgba(255,255,255,.5) inset,
                           0 14px 54px rgba(254,206,14,.6),
                           0 0 120px rgba(254,206,14,.42); }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- 减少动态效果 ---------- */
  @media (prefers-reduced-motion: reduce) {
    .brand .dot, .go-btn.show, .quote.on { animation: none; }
    #veil { transition: none; }
  }

  /* ---------- 兜底：没有 WebGL / 没有 three.js ---------- */
  .fallback { display: none; }
  body.no-3d .fallback { display: block; }
  body.no-3d #scene { display: none; }
  body.no-3d .hud {
    pointer-events: auto;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 78% 24%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 44% 72%, #dfe8ff, transparent),
      radial-gradient(1.2px 1.2px at 88% 66%, #e6ecff, transparent),
      radial-gradient(2px 2px at 62% 12%, #fff, transparent),
      var(--bg);
  }
  body.no-3d #countdown, body.no-3d .hint { display: none; }
  .fallback-inner {
    margin: auto; text-align: center; padding: 0 24px;
  }
  .fallback-inner h1 { font-size: clamp(22px, 6vw, 30px); margin-bottom: 12px; }
  .fallback-inner p { color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }
  .fallback-inner a.go {
    display: inline-block; padding: 14px 30px; border-radius: 999px;
    background: var(--ink); color: #3a2c00; font-weight: 800; text-decoration: none;
  }


</style>
</head>

<script>
(function () {
  'use strict';

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 没有 3D 能力时退回静态页面 ----------
     三种情况都算：three.js 没加载（被拦截）、WebGL 创建失败（老设备）、
     或者用户系统里开了「减少动态效果」。 */
  function useFallback() {
    document.body.classList.add('no-3d');
    var hud = document.getElementById('hud');
    if (hud) hud.classList.remove('gone');
    var cd = document.getElementById('countdown');
    if (cd) cd.hidden = true;
    var gb = document.getElementById('go-btn');
    if (gb) gb.hidden = true;
  }

  if (!window.NailongLaunch || window.__launchFailed) {
    useFallback();
  }

  /* ---------- 顶部语录：从同目录 1.txt 随机抽一行 ---------- */
  // 用 fetch 而不是 XMLHttpRequest：写法短，file:// 下失败也走 catch，不弹错误。
  var quoteEl = document.getElementById('quote');
  var quoteLines = [];
  fetch('1.txt', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error(r.status)); })
    .then(function (txt) {
      quoteLines = txt.replace(/^\uFEFF/, '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (!quoteLines.length) return;
      showQuote();
      setInterval(showQuote, 4200);
      quoteEl.addEventListener('click', showQuote);
    })
    .catch(function () { /* 双击本地打开、或 1.txt 不存在：安静地不显示 */ });

  function showQuote() {
    if (!quoteLines.length) return;
    var next = quoteLines[Math.floor(Math.random() * quoteLines.length)];
    if (quoteLines.length > 1) {
      var guard = 0;
      while (next === quoteEl.textContent && guard++ < 8) {
        next = quoteLines[Math.floor(Math.random() * quoteLines.length)];
      }
    }
    quoteEl.textContent = next;
    quoteEl.classList.remove('on');
    void quoteEl.offsetWidth;   // 强制回流，让淡入动画能重放
    quoteEl.classList.add('on');
  }

  /* ---------- 关于弹窗 ---------- */
  var aboutBtn = document.getElementById('about-btn');
  var about = document.getElementById('about');

  aboutBtn.addEventListener('click', function () {
    if (about.open) return;
    about.showModal();
  });
  // 点遮罩关闭
  about.addEventListener('click', function (e) { if (e.target === about) about.close(); });

  /* ---------- 跳转前的一点统计埋点 ---------- */
  // 旧版是靠倒计时自动跳，现在改成用户点按钮才跳。
  // 记录「打开 → 抵达」的时长，方便知道动画会不会太长让人等不及。
  window.__launchEvent = function (name) {
    try {
      window._hmt.push(['_trackEvent', 'launch', name, '1']);
    } catch (e) { /* 统计脚本被拦就跳过 */ }
  };

  /* ---------- 没有 JS 时也能走 ---------- */
  // <noscript> 里给了直链，这里不再重复处理。
})();
</script>
