<style>
  :root {
    --bg: #fffbef;
    --fg: #3a2c00;
    --muted: #8f7a45;
    --ink: #fece0e;
    --warn: #e0483d;   /* 暂停态：红 */
    --go: #1f9d55;     /* 恢复态：绿 */
    --track: rgba(254, 206, 14, .22);
    --card: #ffffff;
    --size: min(64vw, 44vh, 340px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #080b1a;
      --fg: #eef1ff;
      --muted: #8b93b8;
      --track: rgba(254, 206, 14, .18);
      --card: #141a2e;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px 16px 56px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 星星层：位置固定（写死各坐标），整层缓慢闪烁（keyframes 动 opacity，不动 background-position） */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    opacity: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 28% 72%, #dfe8ff, transparent),
      radial-gradient(1.8px 1.8px at 44% 12%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 61% 46%, #cfe0ff, transparent),
      radial-gradient(1.5px 1.5px at 78% 24%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 89% 66%, #e6ecff, transparent),
      radial-gradient(1.4px 1.4px at 8% 88%, #fff, transparent),
      radial-gradient(1.1px 1.1px at 68% 86%, #cfe0ff, transparent),
      radial-gradient(1.3px 1.3px at 35% 38%, #fff, transparent),
      radial-gradient(1.7px 1.7px at 95% 8%, #fff, transparent);
  }

  /* ---------- 背景：星星 + 缓慢漂移的星云，全部 CSS 动画，零请求 ---------- */
  /* 两层星：body::before 是星星，.nebula 是背后的彩色光斑（比星星更淡） */
  .nebula { position: fixed; inset: -20%; z-index: -2; pointer-events: none; opacity: 0;
            background:
              radial-gradient(38% 34% at 22% 28%, rgba(120,150,255,.30), rgba(120,150,255,0) 70%),
              radial-gradient(32% 30% at 78% 24%, rgba(255,190,120,.22), rgba(255,190,120,0) 70%),
              radial-gradient(40% 36% at 62% 78%, rgba(170,120,255,.22), rgba(170,120,255,0) 70%),
              radial-gradient(28% 26% at 12% 78%, rgba(120,230,200,.18), rgba(120,230,200,0) 70%);
            animation: drift 46s ease-in-out infinite alternate; }
  /* 深色模式下星星 + 星云都点亮；浅色下只留极淡的暖色星云，免得干扰米色背景 */
  @media (prefers-color-scheme: dark) {
    .nebula { opacity: .9; }
    body::before { opacity: .9; animation: twinkle 5.5s ease-in-out infinite; }
  }
  @media (prefers-color-scheme: light) {
    .nebula { opacity: .5; filter: saturate(.7); }
  }
  /* 星云整体缓慢漂移 + 呼吸 */
  @keyframes drift {
    0%   { transform: translate3d(-1.5%, -1%, 0) scale(1); }
    50%  { transform: translate3d(1.5%, 1.5%, 0) scale(1.06); }
    100% { transform: translate3d(-1%, 1%, 0) scale(1.02); }
  }
  /* 星星明暗闪动 */
  @keyframes twinkle {
    0%, 100% { opacity: .55; }
    50%      { opacity: .95; }
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center; }

  /* 校徽：白底圆盘 + 旋转文字环 + 不转的中心奶龙，外面一圈进度条 */
  .wrap { position: relative; display: inline-block;   /* 热区和光晕要相对它定位 */
          transition: transform .45s cubic-bezier(.5, 0, .75, 0), opacity .45s ease-in; }
  .badge { position: relative; width: var(--size); aspect-ratio: 1; }
  .badge::before { content: ""; position: absolute; inset: 1.4%; border-radius: 50%; background: #fff; }
  /* 奶龙和内联 svg 都要绝对定位铺满徽章 */
  .badge img, .badge .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
  .progress { position: absolute; inset: -5.5%; width: 111%; height: 111%; transform: rotate(-90deg); overflow: visible; }
  .progress circle { fill: none; stroke-width: 1.1; stroke-linecap: round; }
  .progress .track { stroke: var(--track); }
  .progress .bar { stroke: var(--ink); stroke-dasharray: 100; stroke-dashoffset: 100; }

  /* 只给读屏器的文字，视觉上藏起来（但不能 display:none，否则读屏器也读不到） */
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* 点奶龙：热区铺满徽章，点了暂停倒计时 */
  .hit { position: absolute; inset: 0; z-index: 3; border: 0; padding: 0; background: none;
         border-radius: 50%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .hit:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
  /* 光晕跟白盘一样大，渐变边缘就收干净。不能给 .wrap 加 overflow:hidden —— 会裁掉 -5.5% 的进度条 */
  .halo { position: absolute; inset: 1.4%; border-radius: 50%; pointer-events: none; opacity: 0;
          transform: scale(.9); transition: opacity .3s, transform .3s;
          background: radial-gradient(circle at center, rgba(254,206,14,.32) 0 46%, rgba(254,206,14,0) 72%); }
  .hit:hover + .halo, .hit:focus-visible + .halo { opacity: 1; transform: scale(1); }
  /* 摸头态：白盘泛粉 + 红光晕，一眼看出「被拦下了」 */
  .petting .badge::before { background: #ffd9d9; }
  .petting .halo { opacity: 1; transform: scale(1);
                   background: radial-gradient(circle at center, rgba(255,86,86,.34) 0 46%, rgba(255,86,86,0) 72%); }
  .petting .pet-face { animation: nudge .5s ease-out; }
  .petting .progress .bar { stroke: var(--warn); }
  .petting .status { color: var(--warn); }
  /* 恢复态：绿色闪一下，表示「重新开始计时了」 */
  .resuming .badge::before { background: #d9f5e4; }
  .resuming .halo { opacity: 1; transform: scale(1);
                    background: radial-gradient(circle at center, rgba(31,157,85,.34) 0 46%, rgba(31,157,85,0) 72%); }
  .resuming .progress .bar { stroke: var(--go); }

  /* 提示条：默认藏在下面，点奶龙时上浮 */
  .pet-msg { display: flex; flex-direction: column; align-items: center; gap: 2px;
             height: 0; opacity: 0; overflow: hidden; transform: translateY(-6px);
             transition: opacity .25s, transform .25s, height .25s; }
  .petting .pet-msg { height: auto; opacity: 1; transform: none; }
  .pet-msg b { font-size: clamp(15px, 4vw, 18px); font-weight: 800; color: var(--warn); letter-spacing: .04em; }
  .pet-msg span { font-size: 13px; color: var(--muted); }
  /* 恢复提示：绿色 */
  .resume-msg { display: flex; flex-direction: column; align-items: center; gap: 2px;
                height: 0; opacity: 0; overflow: hidden; transform: translateY(-6px);
                transition: opacity .25s, transform .25s, height .25s; }
  .resuming .resume-msg { height: auto; opacity: 1; transform: none; }
  .resume-msg b { font-size: clamp(15px, 4vw, 18px); font-weight: 800; color: var(--go); letter-spacing: .04em; }
  .resume-msg span { font-size: 13px; color: var(--muted); }

  .copy { display: flex; flex-direction: column; align-items: center; gap: 10px; transition: opacity .3s, transform .3s; }
  h1 { font-size: clamp(26px, 7vw, 40px); font-weight: 800; letter-spacing: .12em; padding-left: .12em; }
  .status { font-size: clamp(14px, 4vw, 17px); }
  .dots i {
    display: inline-block; width: .3em; height: .3em; margin-left: .18em;
    border-radius: 50%; background: currentColor; vertical-align: middle;
    animation: dot 1s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .hint { font-size: 13px; color: var(--muted); }
  .hint a { color: inherit; }

  /* 右下角「关于」：打开时暂停倒计时 */
  .about-btn {
    position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom));
    padding: 8px 10px; border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 13px; cursor: pointer;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
    transition: color .2s, text-decoration-color .2s, opacity .3s;
  }
  .about-btn:hover, .about-btn:focus-visible { color: var(--fg); text-decoration-color: currentColor; }

  /* 左下角 GitHub 图标，跟「关于」对称。内联 SVG，不额外发请求 */
  .gh-btn {
    position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom));
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
    color: var(--muted); text-decoration: none; opacity: .8; overflow: hidden;
    transition: color .2s, opacity .2s, background-color .2s, transform .3s;
  }
  .gh-btn:hover, .gh-btn:focus-visible { color: var(--fg); opacity: 1; background: var(--track); transform: rotate(-10deg) scale(1.1); }
  /* 图标本体撑满圆形，居中不偏 */
  .gh-btn svg { display: block; width: 23px; height: 23px; }
  .about {
    width: min(360px, calc(100vw - 32px)); margin: auto; padding: 0; border: 0; border-radius: 16px;
    background: var(--card); color: var(--fg); box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
    cursor: auto; user-select: text;
  }
  .about[open] { animation: rise .25s ease-out; }
  .about::backdrop { background: rgba(8, 9, 20, .55); backdrop-filter: blur(3px); }
  .about-body { padding: 24px 22px 18px; }
  .about h2 { font-size: 18px; margin-bottom: 12px; }
  .about p { font-size: 14px; line-height: 1.7; }
  .about p + p { margin-top: 8px; }
  .about code {
    padding: 1px 6px; border-radius: 6px; background: var(--track);
    font: inherit; font-weight: 700; white-space: nowrap;
  }
  .about form { margin-top: 18px; text-align: right; }
  .about form button {
    padding: 8px 18px; border-radius: 999px; background: var(--ink); color: #3a2c00;
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  .run .badge { animation: pop .7s cubic-bezier(.34, 1.56, .64, 1) backwards; }
  .run .core { animation: breathe 1.8s ease-in-out .7s infinite; }
  .run .copy { animation: rise .5s ease-out .15s backwards; }
  /* 进度条独立用 .timing 类：恢复时只重置它，徽章不会跟着重播入场动画 */
  .timing .bar { animation: fill var(--delay) linear forwards; }
  .paused .bar { animation-play-state: paused; }
  .leaving .wrap { transform: scale(1.18); opacity: 0; }
  .leaving .copy { opacity: 0; transform: translateY(8px); }
  .leaving .about-btn { opacity: 0; }
  .leaving .gh-btn { opacity: 0; }

  @keyframes pop { from { transform: scale(.55) rotate(-25deg); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  @keyframes fill { to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes dot { 0%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-.25em); } }
  /* 被摸头时奶龙左右晃一下 */
  @keyframes nudge { 0%, 100% { transform: none; } 30% { transform: rotate(-3deg) scale(1.03); } 65% { transform: rotate(3deg) scale(1.03); } }

  @media (prefers-reduced-motion: reduce) {
    .run .badge, .run .core, .run .copy, .dots i, .about[open], .petting .pet-face { animation: none; }
    .wrap, .copy, .halo, .pet-msg, .resume-msg, .gh-btn { transition: none; }
    /* 动态背景全关：既省电，也尊重「减少动态效果」的系统设置 */
    .nebula, body::before { animation: none !important; }
  }
</style>

  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
</a>
<dialog class="about" id="about" aria-labelledby="about-title">
  <div class="about-body">
    <h2 id="about-title">关于本站</h2>
    <p>本站为奶龙站点：打开 <code>宇宙奶龙大学.com</code>，会先加载此页面，把你送到广州大学官网。</p>
    <p>本站与广州大学并无任何官方关联，域名、校徽与页面均为网友自制，仅作趣味跳转之用。</p>
    <form method="dialog"><button>知道了</button></form>
  </div>
</dialog>
<script>
(() => {
  const TARGET = 'https://www.gzhu.edu.cn/';   // ← 要跳转的大学官网，改这里
  const NAME   = '广州大学';                    // ← 文案里出现的校名，改这里
  const EASTER = '陈宇龙大学';                  // ← 彩蛋：键盘依次按 cy 触发

  const stay = new URLSearchParams(location.search).has('stay'); // 演示用：不跳转，循环播放
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 时序常量 ----
  // 进度条走满 = DELAY + EXIT（约 5.45 秒），之后只留 BUFFER 等最后一帧画完就跳，中间没有空档。
  const DELAY  = reduce ? 1200 : 5000; // 入场动画 + 停留（ms）—— 进度条走完约 5 秒
  const EXIT   = reduce ? 0   : 450;   // 离场（放大淡出）时长，和 CSS .wrap 的 transition 一致
  const BUFFER = 80;                   // 余量：等最后一帧画完再跳
  const TOTAL  = DELAY + EXIT;         // 进度条走满的时刻 = 跳转时刻
  const SPIN   = 4000;                 // 文字环转一圈（ms）
  const RESUME_FLASH = 620;            // 恢复时绿色闪一下的时长

  const body = document.body;
  body.style.setProperty('--delay', TOTAL + 'ms');
  if (stay) document.getElementById('hint').textContent += '（演示模式，不会真的跳转）';

  // 动画期间先把目标页面预热，避免跳过去时白屏一下
  const prefetch = document.createElement('link');
  prefetch.rel = 'prefetch';
  prefetch.href = TARGET;
  document.head.appendChild(prefetch);

  const ring = reduce ? null : document.querySelector('.ring').animate(
    [{ transform: 'rotate(0turn)' }, { transform: 'rotate(1turn)' }],
    { duration: SPIN, iterations: Infinity }
  );

  const aboutBtn = document.getElementById('about-btn');
  const about = document.getElementById('about');
  aboutBtn.hidden = false; // 没有 JS 时弹窗打不开，按钮也就不显示

  const petBtn = document.getElementById('pet');
  const petSub = document.getElementById('pet-sub');
  const hintEl = document.getElementById('hint');
  const hintIdle = hintEl.textContent;
  let petCount = 0;

  // 键盘依次按 c、y：换个校名，纯属好玩
  let seq = '';
  addEventListener('keydown', e => {
    if (e.key.length !== 1) return;
    seq = (seq + e.key.toLowerCase()).slice(-8);
    if (!seq.endsWith('cy')) return;
    const on = document.getElementById('to').textContent === EASTER;
    document.getElementById('title').textContent = on ? '宇宙奶龙大学' : EASTER;
    document.getElementById('to').textContent = on ? NAME : EASTER;
    document.title = document.getElementById('title').textContent;
  });

  let timer, leaving, deadline, petting, flashTimer;

  function arm(ms) {
    deadline = performance.now() + ms;
    timer = setTimeout(() => leave('auto'), ms);
  }

  // 重新开始计时：把进度条动画从头播一遍（只影响 .timing，徽章不会重播入场）
  function restartTiming() {
    body.classList.remove('timing');
    void body.offsetWidth;   // 强制回流，让动画能重新触发
    body.classList.add('timing');
  }

  // 点奶龙：暂停。不记剩余时间 —— 下次恢复是「重新开始计时」，不是接着数
  function pause() {
    if (leaving || petting) return;
    petting = true;
    clearTimeout(timer);
    body.classList.add('paused', 'petting');
    hintEl.textContent = '已暂停';
  }

  // 再点一次：进度条立刻清零重来 + 绿色闪一下
  function unpause() {
    if (!petting || leaving) return;
    petting = false;
    hintEl.textContent = '重新开始计时…';

    // 先重置进度条再撤 paused：反过来的话，进度条会在绿闪那 620ms 里继续走一段
    restartTiming();
    body.classList.remove('petting', 'paused');

    body.classList.add('resuming');            // 绿光一闪
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () {
      body.classList.remove('resuming');        // 闪完撤掉，回到常态
      hintEl.textContent = hintIdle;
      if (leaving) return;
      arm(DELAY);                              // ← 重新计时：完整 DELAY
    }, RESUME_FLASH);
  }

  function start() {
    leaving = false;
    petting = false;
    clearTimeout(flashTimer);
    body.classList.remove('run', 'leaving', 'paused', 'petting', 'resuming');
    hintEl.textContent = hintIdle;
    void body.offsetWidth; // 重新触发 CSS 动画
    body.classList.add('run');
    restartTiming();      // 进度条从头开始
    if (ring) ring.playbackRate = 1;
    arm(DELAY);
  }

  // 计时走完 → 放大淡出 → 稍等 → 真正跳转
  function leave(reason) {
    if (leaving) return;
    leaving = true;
    clearTimeout(timer);
    // 顺手记一笔：是用户等完了（auto）还是等不及点掉的（skip）
    window._hmt.push(['_trackEvent', 'redirect', reason === 'skip' ? 'skip' : 'auto']);
    body.classList.add('leaving');   // 离场动画开始（缩放 + 淡出，EXIT 毫秒）
    if (ring) { // 离场时文字环越转越快
      const t0 = performance.now();
      requestAnimationFrame(function speedUp(now) {
        const k = Math.min(1, (now - t0) / EXIT);
        ring.playbackRate = 1 + 7 * k * k;
        if (k < 1) requestAnimationFrame(speedUp);
      });
    }
    // 离场动画播完（EXIT + BUFFER）立刻跳；演示模式下原地重播
    setTimeout(stay ? start : redirect, EXIT + BUFFER);
  }

  // 摸奶龙：第一次暂停（红），再点重新计时（绿）
  petBtn.addEventListener('click', () => {
    if (leaving) return;
    if (petting) { unpause(); return; }
    pause();
    petCount++;
    window._hmt.push(['_trackEvent', 'pet', 'tap', String(petCount)]);
    if (petCount === 5) {
      petSub.textContent = '奶龙说：按 c 再按 y，有彩蛋';
    }
  });

  // 跳转前给统计脚本留点时间：保证「打开到跳转」至少过 BUDGET 毫秒。
  // 等完动画的（约 3.1s）早已超过预算，不会多等；提前点掉的才补等。被拦截就一秒不等。
  const BUDGET = 1200;
  function redirect() {
    const a = window.__analytics;
    const elapsed = a ? Date.now() - a.start : Infinity;
    if (!a || a.ready || a.failed || elapsed >= BUDGET) {
      location.replace(TARGET);
      return;
    }
    const poll = setInterval(() => {
      const b = window.__analytics;
      if (b.ready || b.failed || Date.now() - b.start >= BUDGET) {
        clearInterval(poll);
        location.replace(TARGET);
      }
    }, 60);
  }

  // 打开「关于」时暂停倒计时和进度条，关闭后从剩余时间继续（「关于」是接着数，摸奶龙是重新数）
  let aboutLeft = 0;
  aboutBtn.addEventListener('click', () => {
    if (leaving || petting) return;
    clearTimeout(timer);
    aboutLeft = Math.max(0, deadline - performance.now());
    body.classList.add('paused');
    about.showModal();
  });
  about.addEventListener('close', () => {
    body.classList.remove('paused');
    if (!leaving) arm(aboutLeft);
  });
  about.addEventListener('click', e => { if (e.target === about) about.close(); }); // 点遮罩关闭

  // 点页面别处 / 按键 = 立即跳转。但点在奶龙、「关于」、GitHub 图标上都不算
  const IGNORED_KEYS = ['Tab', 'Shift', 'Control', 'Alt', 'Meta'];
  const ghBtn = document.querySelector('.gh-btn');
  function skip(e) {
    if (about.open || leaving) return;
    if (petBtn.contains(e.target) || aboutBtn.contains(e.target)) return;
    if (ghBtn && ghBtn.contains(e.target)) return;   // 点 GitHub 图标是去 GitHub，不是跳转
    if (e.type === 'keydown' && IGNORED_KEYS.includes(e.key)) return;
    leave('skip');
  }
  // 用 click 而不是 pointerdown：按钮自己会派发 click，
  // 指针事件在移动端还会先触发 pointerdown，会跟按钮打架。
  addEventListener('click', skip);
  addEventListener('keydown', skip);
  start();
})();
</script>
</body>
</html>
