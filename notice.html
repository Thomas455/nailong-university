<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>网站公告 · 宇宙奶龙大学</title>
<meta name="description" content="宇宙奶龙大学的站内公告和更新记录。">
<meta name="theme-color" content="#080b1a">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* 公告按时间倒序排：编号大的（新的）在上，小的在下。
     左侧一条竖线 + 圆点，读起来像时间轴。 */
  .notes { display: flex; flex-direction: column; gap: 16px; max-width: 760px; margin: 0 auto; }

  .note {
    position: relative; padding: 20px 22px 20px 54px;
    border-radius: 16px; background: var(--card);
    border: 1px solid rgba(254, 206, 14, .16);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
    transition: border-color .22s, background-color .22s;
  }
  .note:hover { border-color: rgba(254, 206, 14, .45); background: var(--card-hi); }

  /* 左侧编号圆点 */
  .note .num {
    position: absolute; left: 16px; top: 20px;
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--track); color: var(--ink);
    font-size: 12px; font-weight: 800;
  }
  .note h2 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .note .body {
    font-size: 14px; line-height: 1.85; color: var(--muted);
    white-space: pre-wrap;              /* txt 里的换行原样保留 */
    word-break: break-word;
  }
  /* AI 署名：比正文更小更淡，右下角对齐，不抢正文 */
  .note .by-ai {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px dashed rgba(254, 206, 14, .18);
    font-size: 12px; color: var(--muted); opacity: .8;
    text-align: right; letter-spacing: .02em;
  }

  .loading { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }
</style>
</head>
<body data-back="home.html" data-back-label="返回">

<div class="wrap-page">
  <header class="page-head">
    <h1>网站公告</h1>
    <p>共 <span id="count">…</span> 条 · 最新的在最上面</p>
  </header>
  <main class="notes" id="notes">
    <p class="loading" id="loading">奶龙正在翻公告……</p>
  </main>
</div>

<script src="assets/site.js"></script>
<script>
// 静态站点没法「列出目录」，所以只能从 1.txt 开始一个个试。
// 关键是并行探测：串行的话每个文件一个往返，GitHub Pages 上约 0.25s RTT，
// 6 个文件就要等 1.5 秒白屏。改成一批 8 个一起发，通常 1 个往返就够。
var MAX_MISS = 2;      // 一批末尾连续缺几个就认定到底了
var BATCH = 8;         // 每批并行探测几个
var HARD_CAP = 200;    // 兜底上限，防止配置错了无限试

(function () {
  var box = document.getElementById('notes');
  var loading = document.getElementById('loading');
  var countEl = document.getElementById('count');

  // 取一个 txt；不存在就 resolve(null)，不抛错
  function grab(n) {
    return fetch('notice/' + n + '.txt', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) return null;
      return r.text();
    }).catch(function () { return null; });
  }

  var found = [];     // [{n, text}]，按编号从小到大

  function runBatch(start) {
    if (start > HARD_CAP) return finish();

    var nums = [];
    for (var k = 0; k < BATCH && start + k <= HARD_CAP; k++) nums.push(start + k);

    // 一批一起发，等全部回来
    return Promise.all(nums.map(function (n) {
      return grab(n).then(function (txt) { return { n: n, txt: txt }; });
    })).then(function (res) {
      res.forEach(function (r) {
        if (r.txt === null) return;
        var body = r.txt.replace(/^\uFEFF/, '').trim();
        if (body) found.push({ n: r.n, text: body });
      });

      // 这一批末尾连着 MAX_MISS 个都是空的 → 认为后面没有了
      var tail = res.slice(-MAX_MISS);
      var done = tail.length >= MAX_MISS && tail.every(function (r) { return r.txt === null; });
      return done ? finish() : runBatch(start + BATCH);
    });
  }

  function finish() {
    if (loading) loading.remove();

    if (!found.length) {
      countEl.textContent = '0';
      var empty = document.createElement('div');
      empty.className = 'empty';
      // 顺带解释一下本地打开为什么看不到 —— file:// 下 fetch 会被浏览器拦掉
      empty.innerHTML = '还没有公告。<br>把 <code>1.txt</code>、<code>2.txt</code>… ' +
                        '放进 <code>notice/</code> 目录就会出现在这里。' +
                        '<br><br>（用 <code>file://</code> 双击打开时浏览器会拦截读取，' +
                        '请用 http 方式预览）';
      box.appendChild(empty);
      return;
    }

    // 倒序：编号大的在上面
    found.sort(function (a, b) { return b.n - a.n; });
    countEl.textContent = found.length;

    var frag = document.createDocumentFragment();
    found.forEach(function (item) {
      var el = document.createElement('article');
      el.className = 'note';

      // 第一行当作标题，其余是正文 —— 让 txt 能写得随意点。
      // 标题以 [AI] 开头表示这条是 AI 写的，右下角会自动加标注。
      var lines = item.text.split(/\r?\n/);
      var title = lines[0].trim();
      var byAI = /^\[AI\]\s*/i.test(title);
      if (byAI) title = title.replace(/^\[AI\]\s*/i, '');
      var rest = lines.slice(1).join('\n').trim();

      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = item.n;
      num.setAttribute('aria-hidden', 'true');

      var h = document.createElement('h2');
      h.textContent = title;

      el.appendChild(num);
      el.appendChild(h);

      if (rest) {
        var p = document.createElement('div');
        p.className = 'body';
        p.textContent = rest;      // textContent 而不是 innerHTML，公告里写什么都不会变成标签
        el.appendChild(p);
      }

      // AI 署名：跟在正文下面，字号更小、更淡
      if (byAI) {
        var sign = document.createElement('p');
        sign.className = 'by-ai';
        sign.textContent = '此公告由 AI Agent 编写';
        el.appendChild(sign);
      }
      frag.appendChild(el);
    });
    box.appendChild(frag);
  }

  runBatch(1);
})();
</script>
</body>
</html>
